name: Bug report
description: "Report a reproducible problem in Runyth Order: Class Assassin 1424."
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, private world exports, or player information.
  - type: checkboxes
    attributes:
      label: Supported environment
      options:
        - label: I reproduced this on Foundry VTT 13.351, D&D 5e 5.3.3, and Runyth Order with API 1.0.0.
          required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Include the Actor level, feature, Item/activity, combat state, and exact actions. Do not include world exports or access tokens.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Diagnostics
      description: Paste reviewed provider diagnostics and relevant console output. Remove player names and filesystem paths first.
